<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Settings</title>
<style>
  :root { --bg: #f4f6fb; --card: #ffffff; --fg: #1c2030; --muted: #5b6176; --line: #dadeea; --accent: #2f66d8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171e; --card: #1f222c; --fg: #e8eaf3; --muted: #9ba1b6; --line: #2e3242; --accent: #7ea3ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px "Malgun Gothic", "Segoe UI", sans-serif; }
  main { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 18px; margin: 0; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin: 0; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  legend { color: var(--muted); font-size: 12px; padding: 0 4px; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button { align-self: flex-end; font: inherit; padding: 6px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <fieldset id="size"><legend id="sizeLabel"></legend>
    <label><input type="radio" name="scale" value="2" id="scale2"><span id="s2"></span></label>
    <label><input type="radio" name="scale" value="3" id="scale3"><span id="s3"></span></label>
    <label><input type="radio" name="scale" value="4" id="scale4"><span id="s4"></span></label>
  </fieldset>
  <fieldset><legend id="behaviorLabel"></legend>
    <label><input type="checkbox" id="perch"><span id="perchLabel"></span></label>
    <label><input type="checkbox" id="hideFullscreen"><span id="hideFullscreenLabel"></span></label>
  </fieldset>
  <fieldset><legend id="etcLabel">Windows</legend>
    <label><input type="checkbox" id="startup"><span id="startupLabel"></span></label>
    <label><span id="langLabel"></span>
      <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
  </fieldset>
  <button id="close" type="button"></button>
</main>
<script src="settings.js"></script>
</body>
</html>
